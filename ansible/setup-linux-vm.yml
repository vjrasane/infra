---
- name: Setup Linux hosts
  hosts: all
  become: yes
  tags: [setup]
  vars:
    tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
  tasks:
    - name: Apply security updates
      apt:
        upgrade: safe
        update_cache: yes

    - name: Setup Tailscale
      tags: [tailscale]
      block:
        - name: Check if Tailscale is installed
          command: which tailscale
          register: tailscale_installed
          failed_when: false
          changed_when: false

        - name: Install Tailscale
          shell: curl -fsSL https://tailscale.com/install.sh | sh
          when: tailscale_installed.rc != 0

        - name: Check Tailscale status
          command: tailscale status
          register: tailscale_status
          failed_when: false
          changed_when: false

        - name: Get Tailscale hostname
          shell: tailscale status --self --json | jq -r '.Self.HostName'
          register: tailscale_hostname
          changed_when: false
          when: tailscale_status.rc == 0

        - name: Join Tailnet
          shell: tailscale up --auth-key={{ tailscale_auth_key }} --hostname={{ inventory_hostname }}
          when: tailscale_status.rc != 0 or (tailscale_hostname.stdout | default('')) != inventory_hostname

    - name: Add SSH keys from GitHub
      tags: [ssh]
      authorized_key:
        user: "{{ ansible_user }}"
        key: https://github.com/vjrasane.keys
        state: present

- name: Mount data volume
  hosts: all
  become: yes
  tags: [setup, mount]
  tasks:
    - name: Check if /mnt/data is a mount point
      command: mountpoint -q /mnt/data
      register: mnt_data_mounted
      failed_when: false
      changed_when: false

    - name: Prompt for block device
      pause:
        prompt: "Block device to mount at /mnt/data (e.g. /dev/sdb). Leave empty to skip"
      register: data_device_prompt
      when: mnt_data_mounted.rc != 0

    - name: Mount data volume
      when: mnt_data_mounted.rc != 0 and (data_device_prompt.user_input | default('')) | length > 0
      block:
        - name: Format device
          filesystem:
            fstype: ext4
            dev: "{{ data_device_prompt.user_input }}"

        - name: Create mount point
          file:
            path: /mnt/data
            state: directory

        - name: Mount and add to fstab
          mount:
            path: /mnt/data
            src: "{{ data_device_prompt.user_input }}"
            fstype: ext4
            opts: defaults,nofail
            state: mounted

- name: Install tools
  hosts: all
  become: yes
  tags: [setup]
  tasks:
    - name: Install restic
      apt:
        name: restic
        state: present

    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Add Docker GPG key
      shell: install -m 0755 -d /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Reset connection for group changes
      meta: reset_connection

- name: Harden OCI instances
  hosts: oci
  become: yes
  tags: [setup, hardening, ports]
  tasks:
    - name: Allow all traffic on tailscale0
      iptables:
        chain: INPUT
        in_interface: tailscale0
        jump: ACCEPT
        action: insert
        rule_num: 5
      notify: Save iptables rules

    - name: Allow traffic from docker network
      iptables:
        chain: INPUT
        source: 172.16.0.0/12
        jump: ACCEPT
        action: insert
        rule_num: 6
      notify: Save iptables rules

    - name: Allow SSH on port 2222
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "2222"
        ctstate: NEW
        jump: ACCEPT
        action: insert
        rule_num: 6
      notify: Save iptables rules

    - name: Install netfilter-persistent
      apt:
        name: iptables-persistent
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
  handlers:
    - name: Save iptables rules
      shell: netfilter-persistent save

- name: Harden non-OCI cloud instances
  hosts: cloud:!oci
  become: yes
  tags: [setup, hardening, ports]
  tasks:
    - name: Install ufw
      apt:
        name: ufw
        state: present

    - name: Allow SSH
      ufw:
        rule: allow
        port: "2222"

    - name: Allow Tailscale UDP
      ufw:
        rule: allow
        port: "41641"
        proto: udp

    - name: Allow all traffic on tailscale0
      ufw:
        rule: allow
        interface: tailscale0
        direction: in

    - name: Enable ufw with default deny
      ufw:
        state: enabled
        default: deny
        direction: incoming

- name: Harden Linux hosts
  hosts: all
  become: yes
  tags: [setup, hardening]
  vars:
    sysctl_overwrite:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1
    ssh_server_ports: ['2222']
  roles:
    - role: devsec.hardening.os_hardening
    - role: devsec.hardening.ssh_hardening
  handlers:
    - name: Restart sshd
      service:
        name: ssh
        state: restarted
