---
- name: Deploy Paperless
  hosts: oci
  tasks:
    - name: Create data directories
      file:
        path: "{{ item }}"
        state: directory
      tags: [files]
      become: yes
      loop:
        - /mnt/data/paperless/data
        - /mnt/data/paperless/media
        - /mnt/data/paperless/export
        - /mnt/data/paperless/consume
        - /mnt/data/paperless/redis
        - /mnt/data/traefik/letsencrypt

    - name: Set data directory ownership
      file:
        path: /mnt/data
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes
      tags: [files]
      become: yes

    - name: Create directories
      file:
        path: "~/{{ item }}"
        state: directory
      tags: [files]
      loop:
        - services
        - scripts
        - logs

    - name: Copy files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      tags: [files, copy]
      loop:
        - src: ../scripts/update-dns.sh
          dest: ~/scripts/update-dns.sh
          mode: "0755"
        - src: ../hosts/ocivm/paperless-backup.sh
          dest: ~/scripts/paperless-backup.sh
          mode: u+rwx

    - name: Decrypt and copy secrets
      copy:
        content: "{{ lookup('community.sops.sops', '../hosts/ocivm/secrets.env') }}"
        dest: ~/.env
        mode: "0600"

    - name: Symlink secrets to services dir
      file:
        src: ~/.env
        dest: ~/services/.env
        state: link
        force: yes

    - name: Schedule restic backup via cron
      tags: [cron, jobs]
      cron:
        name: "restic paperless backup"
        minute: "0"
        hour: "3"
        job: "~/scripts/paperless-backup.sh >> ~/logs/paperless-backup.logs 2>&1"

    - name: Setup DNS update cron
      cron:
        name: "update-dns-{{ item }}"
        minute: "*/5"
        job: "~/scripts/update-dns.sh {{ item }} >> ~/logs/update-dns.log 2>&1"
      tags: [cron, jobs]
      loop:
        - paperless.karkki.org

    - name: Setup log rotation
      copy:
        dest: "/etc/logrotate.d/{{ item.name }}"
        content: |
          {{ item.path }} {
              daily
              rotate 7
              compress
              missingok
              notifempty
              copytruncate
          }
      become: yes
      tags: [cron, jobs]
      loop:
        - name: paperless-backup
          path: /home/ubuntu/logs/paperless-backup.logs
        - name: update-dns
          path: /home/ubuntu/logs/update-dns.log

    - name: Copy docker compose file
      copy:
        src: ../hosts/ocivm/docker-compose.yml
        dest: ~/services/docker-compose.yml
      tags: [docker, files, copy]

    - name: Start services
      tags: [docker]
      community.docker.docker_compose_v2:
        project_src: ~/services
        pull: always
