---
- name: Install dependencies
  become: true
  package:
    name: jq
    state: present

- name: Create scripts directory
  file:
    path: ~/scripts
    state: directory
  tags: [files]

- name: Create logs directory
  file:
    path: ~/logs
    state: directory
  tags: [files]

- name: Copy update-dns script
  copy:
    src: update-dns.sh
    dest: ~/scripts/update-dns.sh
    mode: "0755"
  tags: [files, copy]
  register: dns_script

- name: Decrypt and copy Cloudflare secrets
  copy:
    content: "{{ lookup('community.sops.sops', 'cloudflare-secrets.env') }}"
    dest: ~/.cloudflare.env
    mode: "0600"
  tags: [files]

- name: Setup DNS update cron
  cron:
    name: "update-dns-{{ item.name }}"
    minute: "{{ dns_update_interval }}"
    job: "~/scripts/update-dns.sh {{ item.name }} {{ item.ip_cmd }} >> ~/logs/update-dns.log 2>&1"
  loop: "{{ dns_records }}"
  tags: [cron, jobs]
  register: dns_cron

- name: Run DNS update now
  shell: "~/scripts/update-dns.sh {{ item.name }} {{ item.ip_cmd }}"
  loop: "{{ dns_records }}"
  when: dns_script is changed or dns_cron is changed

- name: Set DNS changed fact
  set_fact:
    dns_changed: "{{ dns_script is changed or dns_cron is changed }}"

- name: Setup log rotation
  copy:
    dest: /etc/logrotate.d/update-dns
    content: |
      {{ ansible_facts["env"]["HOME"] }}/logs/update-dns.log {
          daily
          rotate 7
          compress
          missingok
          notifempty
          copytruncate
      }
  become: yes
  tags: [cron, jobs]
