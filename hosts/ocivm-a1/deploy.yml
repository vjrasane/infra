---
- name: Deploy Paperless
  hosts: ocivm-a1
  roles:
    - role: cloudflare-dns
      dns_records:
        - name: paperless.karkki.org
          ip_cmd: "$(tailscale ip -4)"
  tasks:
    - name: Create data directories
      file:
        path: "{{ item }}"
        state: directory
      tags: [files]
      become: yes
      loop:
        - /mnt/data/paperless/data
        - /mnt/data/paperless/media
        - /mnt/data/paperless/export
        - /mnt/data/paperless/consume
        - /mnt/data/traefik/letsencrypt

    - name: Set data directory ownership
      file:
        path: "{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes
      tags: [files]
      become: yes
      loop:
        - /mnt/data/paperless/data
        - /mnt/data/paperless/media
        - /mnt/data/paperless/export
        - /mnt/data/paperless/consume
        - /mnt/data/traefik

    - name: Create directories
      file:
        path: "~/{{ item }}"
        state: directory
      tags: [files]
      loop:
        - services

    - name: Copy files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      tags: [files, copy]
      loop:
        - src: paperless-backup.sh
          dest: ~/scripts/paperless-backup.sh
          mode: u+rwx

    - name: Decrypt and copy secrets
      copy:
        content: "{{ lookup('community.sops.sops', 'secrets.env') }}"
        dest: ~/.env
        mode: "0600"

    - name: Symlink secrets to services dir
      file:
        src: ~/.env
        dest: ~/services/.env
        state: link
        force: yes

    - name: Schedule restic backup via cron
      tags: [cron, jobs]
      cron:
        name: "restic paperless backup"
        minute: "0"
        hour: "3"
        job: "~/scripts/paperless-backup.sh >> ~/logs/paperless-backup.logs 2>&1"

    - name: Setup log rotation for paperless backup
      copy:
        dest: /etc/logrotate.d/paperless-backup
        content: |
          {{ ansible_env.HOME }}/logs/paperless-backup.logs {
              daily
              rotate 7
              compress
              missingok
              notifempty
              copytruncate
          }
      become: yes
      tags: [cron, jobs]

    - name: Copy docker compose file
      copy:
        src: docker-compose.yml
        dest: ~/services/docker-compose.yml
      tags: [docker, files, copy]

    - name: Start services
      tags: [docker]
      community.docker.docker_compose_v2:
        project_src: ~/services
        pull: always
