---
- name: Deploy Jellyfin
  hosts: rpi5-01
  roles:
    - role: cloudflare-dns
      dns_records:
        - name: jellyfin.karkki.org
          ip_cmd: "$(curl ipinfo.io/ip)"
  tasks:
    - name: Create data directories
      file:
        path: "{{ item }}"
        state: directory
      tags: [files]
      become: yes
      loop: []

    - name: Set data directory ownership
      file:
        path: "{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes
      tags: [files]
      become: yes
      loop: []

    - name: Create services directory
      file:
        path: "~/services"
        state: directory
      tags: [files, secrets, docker]

    - name: Copy files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      tags: [files, copy]
      loop:
        - src: jellyfin-backup.sh
          dest: ~/scripts/jellyfin-backup.sh
          mode: u+rwx

    - name: Decrypt and copy secrets
      copy:
        content: "{{ lookup('community.sops.sops', 'secrets.env') }}"
        dest: ~/.env
        mode: "0600"
      tags: [files, copy, secrets, docker]

    - name: Symlink secrets to services dir
      file:
        src: ~/.env
        dest: ~/services/.env
        state: link
        force: yes
      tags: [files, secrets, docker]

    - name: Create logs directory
      file:
        path: "~/logs"
        state: directory
      tags: [cron, jobs]

    - name: Schedule restic backup via cron
      tags: [cron, jobs]
      cron:
        name: "restic jellyfin backup"
        minute: "0"
        hour: "3"
        job: "~/scripts/jellyfin-backup.sh >> ~/logs/jellyfin-backup.logs 2>&1"

    - name: Setup log rotation for jellyfin backup
      copy:
        dest: /etc/logrotate.d/jellyfin-backup
        content: |
          {{ ansible_facts["env"]["HOME"] }}/logs/jellyfin-backup.logs {
              daily
              rotate 7
              compress
              missingok
              notifempty
              copytruncate
          }
      become: yes
      tags: [cron, jobs]

    - name: Copy docker compose file
      copy:
        src: docker-compose.yml
        dest: ~/services/docker-compose.yml
      tags: [docker, files, copy]

    - name: Start services
      tags: [docker]
      community.docker.docker_compose_v2:
        project_src: ~/services
        pull: always

    - name: Remove traefik container after DNS update
      community.docker.docker_container:
        name: traefik
        state: absent
      when: dns_changed | default(false)
      tags: [docker]

    - name: Remove traefik letsencrypt volume
      community.docker.docker_volume:
        name: traefik-letsencrypt
        state: absent
      when: dns_changed | default(false)
      tags: [docker]

    - name: Recreate traefik after DNS update
      community.docker.docker_compose_v2:
        project_src: ~/services
      when: dns_changed | default(false)
      tags: [docker]
